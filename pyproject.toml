[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locomo-jasper-bench"
version = "0.1.0"
description = "InferScale: High-throughput and memory efficient GPU-Native KV Injection for Personalized LLM Serving"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7",
    "matplotlib>=3.8",
    "mem0ai[nlp]==2.0.11",
    "numpy>=1.24",
    "openai>=2.44,<3",
    "pandas>=2",
    "qdrant-client>=1.17,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
jasper = [
    "torch",
    "apache-tvm-ffi",
]
remote = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchaudio==2.10.0",
    "vllm==0.19.1",
    "transformers==4.56.0",
    "accelerate==1.14.0",
]

[project.scripts]
locomo-jasper-bench = "locomo_jasper_bench.run:main"
locomo-throughput-bench = "locomo_jasper_bench.throughput.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
