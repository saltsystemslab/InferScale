[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locomo-jasper-bench"
version = "0.1.0"
description = "LoCoMo KV-cache benchmark harness for vLLM with Mem0 retrieval backed by Jasper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7",
    "mem0ai[nlp]>=0.1.0",
    "numpy>=1.24",
    "openai>=1.30",
    "qdrant-client>=1.17,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
jasper = [
    "torch",
    "apache-tvm-ffi",
]
remote = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchaudio==2.10.0",
    "vllm==0.19.1",
    "transformers==5.5.1",
]

[project.scripts]
locomo-jasper-bench = "locomo_jasper_bench.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
